<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <meta name="description" content="Formulario de Registro">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
    }

    .cargando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 10;
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #163559;
      transition: opacity 0.3s ease;
    }

    .cargando.oculto {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="cargando" class="cargando">
    Cargando formulario...
  </div>

  <iframe
    id="formulario"
    src="https://script.google.com/macros/s/AKfycbxXpHb1fTKy9de3VRwMKkvn_wPCVj92JEQ_7bbVPzJ_XJrQbHHKz83fI9oGQuFwK1x5Yw/exec"
    allow="clipboard-read; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    loading="eager">
  </iframe>

  <script>
    const iframe = document.getElementById("formulario");
    const cargando = document.getElementById("cargando");

    iframe.addEventListener("load", function () {
      cargando.classList.add("oculto");
      setTimeout(() => cargando.remove(), 300);
    });
  </script>

</body>
</html>
